    <script>
      (function (doc) {
        doc.classList.add('js');
        var width = window.innerWidth;
        try {
          var rawTheme = localStorage.getItem('sipayroll:theme');
          var theme = rawTheme ? JSON.parse(rawTheme) : 'dark';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme === 'light'
              ? 'light'
              : 'dark';
          doc.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#050a18' : '#e9eef8');
          if (localStorage.getItem('sipayroll:rail') === '1' && width > 760) {
            doc.classList.add('is-rail');
          }
        } catch (e) {}
        if (width > 760 && width < 1280) {
          doc.classList.add('is-rail');
        }
      })(document.documentElement);
    </script>
