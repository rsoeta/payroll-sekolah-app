name: Deploy SIPAYROLL ke Shared Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-shared-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Vite & Upload via FTP/FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Aplikasi Produksi (Vite + PWA)
        env:
          VITE_GAS_API_URL: ${{ secrets.VITE_GAS_API_URL }}
        run: npm run build

      - name: Deploy dist/ ke Shared Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: loose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
