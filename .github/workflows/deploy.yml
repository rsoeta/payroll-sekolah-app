name: Build & Auto-Deploy ke Shared Hosting via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production:
    name: Build Vite & Update Branch production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Aplikasi Produksi (Vite + PWA)
        env:
          VITE_GAS_API_URL: ${{ secrets.VITE_GAS_API_URL }}
        run: npm run build

      - name: Publish Hasil Build (dist/) ke Branch production
        run: |
          set -e
          mkdir -p _deploy
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git clone --depth 1 --branch production "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" _deploy
          else
            git -C _deploy init
            git -C _deploy checkout -b production
            git -C _deploy remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          find _deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. _deploy/

          cd _deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada hasil build."
          else
            git commit -m "Build produksi dari ${{ github.sha }}"
            git push -u origin production
          fi

  deploy-ssh:
    name: Auto-Pull ke Shared Hosting via SSH
    needs: build-production
    runs-on: ubuntu-latest

    steps:
      - name: Sinkronkan Branch production ke Hosting
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            APP_DIR="$HOME/public_html/repositories/sipayroll.daaru-syifa-pakenjeng.studio-pasti.net"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "https://github.com/${{ github.repository }}.git"
            fi
            git fetch origin production
            git checkout -f -B production origin/production
            echo "Berhasil deploy ke $APP_DIR"
